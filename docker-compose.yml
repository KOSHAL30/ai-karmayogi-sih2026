version: '3.8'

networks:
  karmayogi_net:
    name: karmayogi_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
    name: karmayogi_pgdata
  ollamadata:
    name: karmayogi_ollamadata
  document_uploads:
    name: karmayogi_uploads

services:
  # =========================================================================
  # 1. Edge Reverse Proxy & Gateway (Nginx)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: karmayogi_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - karmayogi_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================================================================
  # 2. Presentation Tier: React 19 Frontend
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: karmayogi_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    networks:
      - karmayogi_net

  # =========================================================================
  # 3. Application Tier: FastAPI Backend Server (Python 3.12)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: karmayogi_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=AI Karmayogi
      - DATABASE_URL=postgresql+asyncpg://karmayogi_admin:KarmayogiSecure2026@postgres:5432/karmayogi_db
      - DATABASE_URL_SYNC=postgresql://karmayogi_admin:KarmayogiSecure2026@postgres:5432/karmayogi_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET=sovereign_secret_key_sih2026_dopt_mission_karmayogi_secure_random_seed_99482
      - JWT_REFRESH_SECRET=sovereign_refresh_secret_sih2026_dopt_mission_karmayogi_token_seed_88312
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIR=/app/uploads
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_MODEL=qwen3:8b
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - karmayogi_net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

  # =========================================================================
  # 4. Relational & Vector Persistence: PostgreSQL 16 + pgvector
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: karmayogi_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=karmayogi_db
      - POSTGRES_USER=karmayogi_admin
      - POSTGRES_PASSWORD=KarmayogiSecure2026
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - karmayogi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karmayogi_admin -d karmayogi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M

  # =========================================================================
  # 5. Local Cognitive AI Inference Engine: Ollama
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: karmayogi_ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - karmayogi_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '8.0'
          memory: 16384M
