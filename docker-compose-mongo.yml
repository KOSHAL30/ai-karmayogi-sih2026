version: '3.8'
networks:
  karmayogi_net:
    name: karmayogi_net
    driver: bridge
volumes:
  mongodata:
services:
  mongodb:
    image: mongo:latest
    container_name: karmayogi_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - karmayogi_net
