# ==============================================================================
# AI KARMAYOGI — ALEMBIC CONFIGURATION
# Migration Environment for Sovereign PostgreSQL Database
# ==============================================================================

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path
prepend_sys_path = .

# Timezone to use when rendering the date
timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a corresponding .py to be considered valid revisions
sourceless = false

# Database URL (Overridden dynamically in alembic/env.py from app.core.config.settings)
sqlalchemy.url = postgresql://karmayogi_admin:Karmayogi2026Secure!@localhost:5432/karmayogi_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
