<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#12253d" />
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="48" height="48" rx="12" fill="url(#flagGrad)" />
  <!-- Tricolor Accent Line -->
  <rect x="0" y="0" width="48" height="3" rx="1.5" fill="url(#tricolor)" />
  <!-- Compass Star / Ashoka 24 Spokes Stylized -->
  <circle cx="24" cy="25" r="14" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.6" />
  <circle cx="24" cy="25" r="4" fill="#38bdf8" />
  <!-- 4 Primary Cardinal Points -->
  <polygon points="24,14 26,23 35,25 26,27 24,36 22,27 13,25 22,23" fill="#ffffff" />
  <!-- 4 Diagonal Accent Points -->
  <polygon points="24,17 25,24 31,25 25,26 24,33 23,26 17,25 23,24" fill="#93c5fd" opacity="0.7" />
  <!-- Center Pin -->
  <circle cx="24" cy="25" r="1.5" fill="#1e3a5f" />
</svg>
